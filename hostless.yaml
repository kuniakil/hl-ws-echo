build:
  system: docker
  min_cpu: 0.05
  max_cpu: 0.25
  min_memory: 128
  max_memory: 256

dockerfile_path: "./Dockerfile"

scaling:
  trigger: http_requests
  min_cpu: 0.05
  max_cpu: 0.25
  min_memory: 128
  max_memory: 256
  min_replicas: 1
  max_replicas: 1

health_check:
  type: tcp
  interval_in_seconds: 30
